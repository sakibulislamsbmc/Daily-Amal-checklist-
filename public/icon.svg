<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Islamic Crescent & Star Symbol -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    <!-- Crescent -->
    <path d="M 40,-100 A 110,110 0 1 0 110,70 A 90,90 0 1 1 40,-100 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Star -->
    <path d="M 65,-50 L 71,-32 L 90,-32 L 75,-20 L 80,-2 L 65,-12 L 50,-2 L 55,-20 L 40,-32 L 59,-32 Z" fill="#fef08a"/>
  </g>

  <!-- Modern Verified Checkmark Badge at Bottom Right -->
  <g filter="url(#shadow)" transform="translate(300, 300)">
    <circle cx="50" cy="50" r="50" fill="#065f46" stroke="#34d399" stroke-width="4"/>
    <path d="M 32 50 L 44 62 L 68 36" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
